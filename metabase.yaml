apiVersion: v1
kind: Namespace
metadata:
  name: metabase
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: metabase
  labels:
    app: metabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:v0.50.30
          ports:
            - containerPort: 3000
          env:
            - name: MB_DB_TYPE
              value: postgres
          envFrom:
            - secretRef:
                name: metabase-db
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: metabase
spec:
  # Internal at first: Metabase opens on its setup wizard, and whoever reaches it
  # first creates the admin account. Finish the setup through kubectl port-forward,
  # then expose it as a LoadBalancer (README, steps 6 and 7).
  type: ClusterIP
  selector:
    app: metabase
  ports:
    - name: http
      port: 80
      targetPort: 3000
